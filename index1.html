<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TouchGrass – Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#DDE4D6;color:#14281C;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #2F7D3B;outline-offset:2px}
h1,h2,h3,p{margin:0}
.d{font-family:'Bricolage Grotesque',Inter,system-ui,sans-serif}
.muted{color:#56675B}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}

/* demo switcher */
.switcher{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:4px;background:#14281C;padding:4px;border-radius:999px;box-shadow:0 8px 24px rgba(20,40,28,.25)}
.switcher button{height:34px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:#C9D6CC;font-size:13px;font-weight:600;white-space:nowrap}
.switcher button[aria-pressed="true"]{background:#F4C542;color:#14281C}

/* stage + phone */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:64px 16px 24px}
.phone{width:390px;height:844px;max-height:calc(100vh - 88px);min-height:640px;border-radius:40px;overflow:hidden;position:relative;background:#F1F4EC;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(20,40,28,.28)}
.phone.dark{background:#14281C}
@media (max-width:480px){
  .stage{padding:56px 0 0;align-items:stretch}
  .phone{width:100vw;height:calc(100dvh - 56px);max-height:none;min-height:0;border-radius:0;box-shadow:none}
}
.scroll{flex:1;overflow-y:auto;padding:24px 20px 28px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.scroll>*{flex-shrink:0}
.card{background:#fff;border-radius:22px;padding:18px}
.btn{height:48px;border:0;border-radius:14px;font-size:15px;font-weight:700;padding:0 16px}
.btn-dark{background:#14281C;color:#fff}
.btn-yellow{background:#F4C542;color:#14281C}
.btn-green{background:#2F7D3B;color:#fff}
.btn-ghost{background:transparent;color:#fff;border:1px solid #4A6553}
.btn-outline{background:transparent;color:#14281C;border:2px solid #14281C}
.btn[disabled]{cursor:not-allowed}
.linkbtn{border:0;background:transparent;font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;height:40px}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.av{display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;font-family:'Bricolage Grotesque',Inter,sans-serif}
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex-shrink:0;height:40px;padding:0 16px;border-radius:999px;border:1px solid #D3DCD5;background:#fff;color:#14281C;font-size:14px;font-weight:600}
.fbtn[aria-pressed="true"]{background:#14281C;color:#fff;border-color:#14281C}
.track{height:8px;background:#E3EADF;border-radius:999px;overflow:hidden}
.track>div{height:100%;border-radius:999px}
.art{display:block;width:100%;overflow:hidden}
.art svg{display:block;width:100%;height:100%}

/* nav */
.nav{flex-shrink:0;height:80px;background:#fff;border-top:1px solid #E3EADF;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 6px 10px}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:#7A8A7F}
.nav button[aria-current="page"]{color:#14281C}

/* screen time bar */
.stb-fill{height:14px;border-radius:999px;width:0;transition:width 900ms cubic-bezier(.22,1,.36,1),background-color 700ms ease}

/* overlays + motion */
.toast{position:absolute;top:16px;left:20px;right:20px;z-index:20;background:#14281C;color:#fff;border-radius:16px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;animation:tgDrop .35s cubic-bezier(.22,1,.36,1) both}
.overlay{position:absolute;inset:0;z-index:30;background:rgba(10,20,14,.8);display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.sheet-wrap{position:absolute;inset:0;z-index:25;background:rgba(20,40,28,.4);display:flex;align-items:flex-end}
.sheet{width:100%;background:#FFFDF8;border-radius:28px 28px 0 0;padding:12px 24px 32px;display:flex;flex-direction:column;gap:18px;animation:tgSheet .35s cubic-bezier(.22,1,.36,1) both}
@keyframes tgPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes tgFall{0%{transform:translateY(-40px) rotate(0);opacity:1}100%{transform:translateY(900px) rotate(540deg);opacity:.9}}
@keyframes tgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes tgSheet{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
@keyframes tgDrop{0%{transform:translateY(-20px);opacity:0}100%{transform:translateY(0);opacity:1}}
.pop{animation:tgPop .55s cubic-bezier(.2,.9,.3,1.2) both}
.confetti{position:absolute;top:0;width:8px;height:14px;border-radius:2px;animation-name:tgFall;animation-timing-function:ease-in;animation-iteration-count:infinite}
.pulse{display:inline-block;animation:tgPulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pop,.confetti,.pulse,.sheet,.toast{animation:none}.stb-fill{transition:none}}

/* partner portal */
.portal{min-height:100vh;background:#F1F4EC;padding-top:56px}
.portal header{background:#fff;border-bottom:1px solid #E3EADF}
.wrap{max-width:1440px;margin:0 auto;padding:14px 32px}
.pbody{max-width:1440px;margin:0 auto;padding:24px 32px 48px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.side{flex:1 1 200px;max-width:100%;display:flex;flex-direction:column;gap:4px}
.side button{height:44px;border:0;border-radius:12px;background:transparent;color:#56675B;font-size:15px;font-weight:600;text-align:left;padding:0 14px}
.side button[aria-current="page"]{background:#fff;color:#14281C;font-weight:700;box-shadow:inset 3px 0 0 #2F7D3B}
.pmain{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tbl{min-width:860px}
.tr{display:grid;grid-template-columns:44px minmax(220px,2fr) minmax(170px,1.6fr) 1fr 1fr 1fr .9fr;gap:12px;align-items:center;padding:12px;border-bottom:1px solid #EEF2EB;font-size:14px}
.th{font-size:12px;font-weight:600;color:#56675B;text-transform:uppercase;letter-spacing:.05em;padding-top:0;border-bottom-color:#E3EADF}
.r{text-align:right}
.sbtn{height:36px;padding:0 12px;border:0;border-radius:10px;background:#F1F4EC;color:#56675B;font-size:13px;font-weight:600}
.sbtn[aria-pressed="true"]{background:#E6F1E3;color:#1F5A29}
@media (max-width:640px){.wrap,.pbody{padding-left:16px;padding-right:16px}}
</style>
</head>

  function p(h){ return [1,3,5].map(function(i){ return parseInt(h.slice(i,i+2),16); }); }

/* ---------------- actions ---------------- */
function set(patch){ Object.assign(S, patch); render(); }
function toast(msg){ clearTimeout(toastTimer); set({ toast: msg }); toastTimer = setTimeout(function(){ if (S.toast === msg) set({ toast: '' }); }, 4500); }
function stat(id){ return S.status[id] || 'open'; }
function prog(id){ return S.prog[id] || 0; }
function findCh(id){ return challengeDefs().filter(function(d){ return d.id === id; })[0]; }
function findEx(id){ return EXPERIENCES.filter(function(e){ return e.id === id; })[0]; }
function addWin(w, note){ return [{ title: w.title, note: note + ' · Details sent to your guardian' }].concat(S.wins); }

var A = {
  view: function(v){ S.view = v; if (v === 'member') { lastFill = 0; } render(); window.scrollTo(0,0); },
  tab: function(t){ set({ tab: t }); },
  startBreak: function(){
    clearInterval(timer); set({ brk: 'running', remaining: 30 });
    timer = setInterval(function(){
      var left = S.remaining - 1;
      if (left <= 0) { clearInterval(timer); timer = null; S.brk = 'idle'; S.remaining = 30; S.seeds += 40; toast('Break complete! +40 seeds added.'); }
      else set({ remaining: left });
    }, 1000);
  },
  endBreak: function(){ clearInterval(timer); timer = null; S.brk = 'idle'; S.remaining = 30; toast('Break ended early. No seeds this time.'); },
  dismissToast: function(){ set({ toast: '' }); },
  cat: function(c){ set({ cat: c }); },
  join: function(id){ var d = findCh(id); S.status[id] = 'active'; S.prog[id] = 0; toast('You joined ' + d.brand + '’s “' + d.title + '”. Track it in Active.'); },
  log: function(id){
    var d = findCh(id), n = prog(id) + 1;
    if (n >= d.total) { S.status[id] = 'done'; S.prog[id] = d.total; S.seeds += d.seeds; toast(d.brand + ' challenge complete! +' + d.seeds + ' seeds and your reward is unlocked.'); }
    else { S.prog[id] = n; toast('Progress logged: ' + n + ' of ' + d.total + ' ' + d.unit + '.'); }
  },
  reveal: function(id){ S.codes[id] = true; render(); },
  xf: function(f){ set({ xf: f }); },
  enter: function(id){
    var e = findEx(id), n = S.entries[id] || 0;
    if (S.seeds < e.cost) return toast('Not enough seeds for another entry yet.');
    if (n >= 10) return toast('That’s the max of 10 entries for this draw.');
    S.seeds -= e.cost; S.entries[id] = n + 1; toast('Entry ' + (n + 1) + ' added to the ' + e.title + ' draw. Good luck!');
  },
  draw: function(id){ var e = findEx(id); S.won[id] = true; var w = { kicker:'You won!', kind:e.kind, title:e.title, sub:e.sub }; set({ win: w, wins: addWin(w, 'Won in a prize draw') }); },
  unlock: function(id){ var e = findEx(id); S.seeds -= e.cost; S.unlocked[id] = true; var w = { kicker:'Unlocked!', kind:e.kind, title:e.title, sub:e.sub }; set({ win: w, wins: addWin(w, 'Unlocked with seeds') }); },
  simulate: function(){
    var red = Math.min(S.red + 5, 60), hit = [40,50].filter(function(t){ return S.red < t && red >= t; })[0];
    S.red = red; S.seeds += 120; S.weekEarned += 120;
    if (hit) { var sp = SURPRISES[hit]; var w = { kicker:'Surprise reward!', kind:sp.kind, title:sp.title, sub:sp.sub }; set({ win: w, wins: addWin(w, 'Surprise at ' + hit + '% less screen time') }); }
    else toast('Great week! +120 seeds. You’re now at ' + red + '% less screen time.');
  },
  closeWin: function(){ set({ win: null }); },
  toggleDev: function(){ set({ devOpen: !S.devOpen }); },
  openSettings: function(){ set({ settingsOpen: true }); },
  closeSettings: function(){ set({ settingsOpen: false }); },
  goalDown: function(){ set({ goal: Math.max(60, S.goal - 30) }); },
  goalUp: function(){ set({ goal: Math.min(600, S.goal + 30) }); },
  niche: function(n){ set({ niche: n }); },
  sort: function(s){ set({ sort: s }); }
};

});

});

  if ((el = $('#stbNum'))) el.textContent = fmt(S.used);

  if ((el = $('#stbPill'))) { el.textContent = b.left; el.style.background = b.over ? '#FBE3DC' : '#EEF4EA'; el.style.color = b.over ? '#8A3A26' : '#1F5A29'; }
  if ((el = $('#devVal'))) el.textContent = fmt(S.used);

}

}

function expActions(e, dark){
  var n = S.entries[e.id] || 0, afford = S.seeds >= e.cost, won = !!S.won[e.id], unl = !!S.unlocked[e.id];
  var main = dark ? 'btn-yellow' : 'btn-dark', soft = dark ? 'background:#1E2D57;color:#fff' : 'background:#E6F1E3;color:#1F5A29';
  var h = dark ? 52 : 48;
  if (e.type === 'draw') {
    if (won) return '<div style="height:'+h+'px;border-radius:14px;background:#F4C542;color:#14281C;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">You won this one!</div>';
    if (n > 0) return '<div class="col" style="gap:6px"><div style="display:flex;gap:8px"><span style="flex:1;height:'+h+'px;border-radius:14px;'+soft+';display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">'+n+(n===1?' entry':' entries')+'</span><button type="button" class="btn '+main+'" data-act="enter" data-id="'+e.id+'" style="flex:1;height:'+h+'px;font-size:14px">+1 entry · '+num(e.cost)+'</button></div><button type="button" class="linkbtn" data-act="draw" data-id="'+e.id+'" style="color:'+(dark?'#fff':'#14281C')+'">See draw result (demo)</button></div>';
    if (!afford) return '<button type="button" class="btn" disabled style="height:'+h+'px;'+(dark?'background:#1E2D57;color:#C9D3EA':'background:#E3EADF;color:#56675B')+'">'+num(e.cost-S.seeds)+' more seeds needed</button>';
    return '<button type="button" class="btn '+main+'" data-act="enter" data-id="'+e.id+'" style="height:'+h+'px">Enter draw · '+num(e.cost)+' seeds</button>';
  }
  if (unl) return '<div style="height:48px;border-radius:14px;background:#E6F1E3;color:#1F5A29;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">Unlocked · details sent to your guardian</div>';
  if (afford) return '<button type="button" class="btn btn-green" data-act="unlock" data-id="'+e.id+'">Unlock · '+num(e.cost)+' seeds</button>';
  var pct = Math.min(100, Math.round(S.seeds/e.cost*100));
  return '<div class="col" style="gap:6px"><div class="track" style="height:10px"><div style="width:'+pct+'%;background:#2F7D3B"></div></div><span class="muted" style="font-size:13px"><strong style="color:#14281C">'+pct+'% there.</strong> '+num(e.cost-S.seeds)+' more seeds needed to unlock.</span></div>';
}

      '<div class="row"><span class="av" style="width:40px;height:40px;border-radius:12px;background:#14281C;color:#fff">'+d.brand.charAt(0)+'</span><div class="grow col" style="gap:1px"><span class="muted" style="font-size:12px;font-weight:600">'+d.brand+'</span><h2 style="font-size:17px;font-weight:700">'+d.title+'</h2></div><span class="chip" style="background:#FBEFC4;color:#9A5B0B">'+d.left+(d.left===1?' day left':' days left')+'</span></div>'+
      '<div class="col" style="gap:8px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="d" style="font-size:28px;font-weight:800">'+pct+'%</span><span style="font-size:14px;font-weight:600">'+n+' of '+d.total+' '+d.unit+'</span></div><div style="display:grid;grid-template-columns:repeat('+d.total+',minmax(0,1fr));gap:4px">'+steps+'</div></div>'+

    '</article>';
  }).join('');
  var doneHtml = done.length ? '<h2 style="font-size:17px;font-weight:700;margin-top:4px">Completed</h2>' + done.map(function(d){

      '<button type="button" class="btn btn-dark" data-act="closeWin" style="width:100%;height:52px;font-size:16px">Amazing!</button></div></div></div>';
  }
  return '<div class="stage"><div class="phone">'+settings+win+toastHtml+
    '<div class="scroll" id="scroll">'+
      '<div class="row" style="justify-content:space-between"><div class="col grow" style="gap:2px"><span class="muted" style="font-size:13px;font-weight:500">'+heads[S.tab][0]+'</span><h1 class="d" style="font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1">'+heads[S.tab][1]+'</h1></div><div aria-label="Seed balance" class="row" style="flex-shrink:0;gap:6px;background:#fff;border-radius:999px;padding:8px 14px 8px 10px;font-weight:700;font-size:15px">'+I.seed(18,'#2F7D3B')+'<span>'+num(S.seeds)+'</span></div></div>'+
      body+
    '</div><nav class="nav" aria-label="Main">'+tabs+'</nav></div></div>';
}

/* ---------------- start ---------------- */
function start(){
  return '<div class="stage"><div class="phone dark" style="color:#fff;justify-content:space-between;padding:56px 24px 40px">'+
    '<div class="col" style="gap:20px"><span class="av" style="width:64px;height:64px;border-radius:20px;background:#F4C542;color:#14281C">'+I.seed(36)+'</span><h1 class="d" style="font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:.95">TouchGrass</h1><p style="font-size:18px;line-height:1.45;color:#C9D6CC">Less scrolling, more living. Members earn seeds for time off their phones; partner brands turn those seeds into real-world rewards.</p></div>'+
    '<div class="col" style="gap:12px">'+
      '<button type="button" data-act="view" data-id="member" class="row" style="gap:14px;background:#F4C542;color:#14281C;border:0;border-radius:18px;padding:18px;text-align:left"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span class="grow col" style="gap:2px"><span style="font-size:17px;font-weight:700">I’m a member</span><span style="font-size:13px">Track screen time, earn and spend seeds</span></span>'+I.chev+'</button>'+
      '<button type="button" data-act="view" data-id="partner" class="row" style="gap:14px;background:transparent;color:#fff;border:2px solid #4A6553;border-radius:18px;padding:16px 18px;text-align:left"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/></svg><span class="grow col" style="gap:2px"><span style="font-size:17px;font-weight:700">I’m a partner brand</span><span style="font-size:13px;color:#C9D6CC">Publish challenges, see your niche</span></span>'+I.chev+'</button>'+
    '</div></div></div>';
}

/* ---------------- partner ---------------- */
function partner(){
  var niche = PARTNERS[S.niche], MINE = 'sports';
  var objs = niche.list.map(function(p){ return { name:p[0], tag:p[1], score:p[2], members:p[3], published:p[4], live:p[5], trend:p[6], ch:p[7], completion:p[8], me:p[0]==='Stride Running Co.' }; });
  var tones = [['#E6F1E3','#1F5A29'],['#FBEFC4','#5C4500'],['#E3EAF4','#1E3A5F'],['#F3E6DF','#6B2F14']];
  var sortKeys = { score:'Popularity', published:'Challenges published', members:'Members joined', trend:'Trend' };
  var sorted = objs.slice().sort(function(a,b){ return b[S.sort]-a[S.sort]; });
  function sum(k2){ return objs.reduce(function(a,p){ return a+p[k2]; },0); }
  var byScore = objs.slice().sort(function(a,b){ return b.score-a.score; });
  var kpis = [['Active partners',objs.length,'publishing in '+niche.label],['Challenges published',sum('published'),'in the last 30 days'],['Live right now',sum('live'),'open for members to join'],['Members reached',k(sum('members')),'joined a challenge this month']].map(function(x){
    return '<div class="card col" style="gap:4px;border-radius:18px"><span class="muted" style="font-size:13px;font-weight:500">'+x[0]+'</span><span class="d" style="font-size:34px;font-weight:800;letter-spacing:-.02em">'+x[1]+'</span><span class="muted" style="font-size:12px">'+x[2]+'</span></div>';
  }).join('');
  var nicheBtns = Object.keys(PARTNERS).map(function(key){ return '<button type="button" class="fbtn" data-act="niche" data-id="'+key+'" aria-pressed="'+(S.niche===key)+'">'+PARTNERS[key].label+(key===MINE?' · yours':'')+'</button>'; }).join('');
  var pos;
  if (S.niche === MINE) {
    var me = objs.filter(function(p){ return p.me; })[0], rank = byScore.indexOf(me)+1, lead = byScore[0];
    var avgPub = sum('published')/objs.length, avgMem = sum('members')/objs.length;
    var maxPub = Math.max.apply(null, objs.map(function(p){ return p.published; })), maxMem = Math.max.apply(null, objs.map(function(p){ return p.members; }));
    var cmp = [['Challenges published',me.published,avgPub.toFixed(1),me.published/maxPub,avgPub/maxPub],['Members joined',k(me.members),k(Math.round(avgMem)),me.members/maxMem,avgMem/maxMem]].map(function(c){
      return '<div class="col" style="gap:6px"><div style="display:flex;justify-content:space-between;font-size:13px;gap:8px"><span>'+c[0]+'</span><span style="color:#C9D6CC">You '+c[1]+' · niche avg '+c[2]+'</span></div><div style="position:relative;height:8px;background:#2C4434;border-radius:999px"><div style="height:8px;width:'+Math.round(c[3]*100)+'%;background:#F4C542;border-radius:999px"></div><div aria-hidden="true" style="position:absolute;top:-3px;left:'+Math.round(c[4]*100)+'%;width:2px;height:14px;background:#fff"></div></div></div>';
    }).join('');
    pos = '<section style="background:#14281C;color:#fff;border-radius:20px;padding:22px" class="col"><div class="col" style="gap:16px"><h2 style="font-size:16px;font-weight:700;color:#C9D6CC">Your position</h2><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="d" style="font-size:56px;font-weight:800;letter-spacing:-.03em;color:#F4C542">#'+rank+'</span><span style="font-size:15px;color:#C9D6CC">of '+objs.length+' partners by popularity</span></div><div class="col" style="gap:10px">'+cmp+'</div><p style="font-size:14px;line-height:1.5;color:#E7EEE8">'+lead.name+' leads with '+lead.published+' challenges this month, '+(lead.published-me.published)+' more than you. Your growth (+'+me.trend+'%) is the fastest in Sports.</p></div></section>';
  } else {
    pos = '<section style="background:#fff;border:2px dashed #B8C6BB;border-radius:20px;padding:22px" class="col"><div class="col" style="gap:12px;align-items:flex-start"><h2 style="font-size:18px;font-weight:700">Browsing outside your niche</h2><p class="muted" style="font-size:14px;line-height:1.5">Stride Running Co. competes in Sports. Partners here aren’t ranked against you, but they can be good co-challenge collaborators.</p><button type="button" class="btn btn-outline" data-act="niche" data-id="sports" style="height:44px;font-size:14px">Back to Sports</button></div></section>';
  }
  var top = objs.slice().sort(function(a,b){ return b.members-a.members; }).slice(0,3).map(function(p,i){
    return '<div class="row" style="padding-top:12px;border-top:1px solid #E3EADF"><span class="d muted" style="width:28px;font-size:20px;font-weight:800">'+(i+1)+'</span><div class="grow col" style="gap:2px"><span style="font-size:15px;font-weight:700">'+p.ch+'</span><span class="muted" style="font-size:13px">'+p.name+'</span></div><div class="col" style="align-items:flex-end;gap:2px"><span style="font-size:14px;font-weight:700">'+k(Math.round(p.members*.27/10)*10)+' joined</span><span class="muted" style="font-size:12px">'+p.completion+'% finish</span></div></div>';
  }).join('');
  var sorts = Object.keys(sortKeys).map(function(key){ return '<button type="button" class="sbtn" data-act="sort" data-id="'+key+'" aria-pressed="'+(S.sort===key)+'">'+sortKeys[key]+'</button>'; }).join('');
  var rows = sorted.map(function(p,i){
    var t = tones[i%4];
    return '<div class="tr" style="'+(p.me?'background:#E6F1E3;border-radius:12px':'')+'"><span class="muted" style="font-weight:700">'+(i+1)+'</span>'+
      '<span class="row" style="gap:10px;min-width:0"><span class="av" style="width:34px;height:34px;border-radius:10px;background:'+(p.me?'#2F7D3B':t[0])+';color:'+(p.me?'#fff':t[1])+';font-family:Inter,sans-serif;font-weight:700">'+p.name.charAt(0)+'</span><span class="col" style="min-width:0"><span style="font-weight:700">'+p.name+'</span><span class="muted" style="font-size:12px">'+p.tag+'</span></span></span>'+
      '<span class="row" style="gap:10px"><span class="track grow"><div style="width:'+p.score+'%;background:#2F7D3B"></div></span><span style="width:28px;text-align:right;font-weight:700">'+p.score+'</span></span>'+
      '<span class="r">'+num(p.members)+'</span><span class="r" style="font-weight:700">'+p.published+'</span><span class="r">'+p.live+'</span>'+
      '<span class="r" style="font-weight:700;color:'+(p.trend>=0?'#2F7D3B':'#9A5B0B')+'">'+(p.trend>=0?'↑ +':'↓ ')+p.trend+'%</span></div>';
  }).join('');
  var sideItems = ['Overview','Market','My challenges','Rewards catalog','Members','Settings'].map(function(s){ return '<button type="button"'+(s==='Market'?' aria-current="page"':'')+'>'+s+'</button>'; }).join('');
  return '<div class="portal">'+
    '<header><div class="wrap row" style="justify-content:space-between;flex-wrap:wrap"><div class="row" style="gap:10px"><span class="av" style="width:38px;height:38px;border-radius:12px;background:#14281C;color:#F4C542">'+I.seed(22)+'</span><span class="d" style="font-size:22px;font-weight:800;letter-spacing:-.02em">TouchGrass</span><span class="chip" style="background:#E6F1E3;color:#1F5A29">Partners</span></div>'+
      '<div class="row" style="flex-wrap:wrap"><div class="row" style="gap:10px"><span class="av" style="width:36px;height:36px;border-radius:999px;background:#2F7D3B;color:#fff;font-family:Inter,sans-serif;font-size:14px;font-weight:700">S</span><span class="col"><span style="font-size:14px;font-weight:700">Stride Running Co.</span><span class="muted" style="font-size:12px">Sports · Madrid</span></span></div><button type="button" class="btn btn-dark row" style="height:44px;font-size:14px;gap:8px">'+I.plus+'New challenge</button></div></div></header>'+
    '<div class="pbody"><nav class="side" aria-label="Partner sections">'+sideItems+'</nav><main class="pmain">'+
      '<div class="col" style="gap:6px"><span class="muted" style="font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase">Market · last 30 days</span><h1 class="d" style="font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em">Active partners in '+niche.label+'</h1><p class="muted" style="font-size:15px;max-width:640px;line-height:1.5">See who else is rewarding members in your niche, how popular they are and how often they publish challenges.</p></div>'+
      '<div role="group" aria-label="Niche" style="display:flex;flex-wrap:wrap;gap:8px">'+nicheBtns+'</div>'+
      '<div class="kpis">'+kpis+'</div>'+
      '<div class="two">'+pos+'<section class="card col" style="gap:14px;border-radius:20px;padding:22px"><div style="display:flex;justify-content:space-between;align-items:baseline"><h2 style="font-size:18px;font-weight:700">Most-joined challenges</h2><span class="muted" style="font-size:13px">'+niche.label+'</span></div>'+top+'</section></div>'+
      '<section class="card col" style="gap:16px;border-radius:20px;padding:22px"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><h2 style="font-size:18px;font-weight:700">Partners ranked by '+sortKeys[S.sort].toLowerCase()+'</h2><div role="group" aria-label="Sort by" style="display:flex;flex-wrap:wrap;gap:6px">'+sorts+'</div></div>'+
        '<div style="overflow-x:auto"><div class="tbl"><div class="tr th"><span>#</span><span>Partner</span><span>Popularity</span><span class="r">Members joined</span><span class="r">Challenges (30d)</span><span class="r">Live now</span><span class="r">Trend</span></div>'+rows+'</div></div>'+
        '<p class="muted" style="font-size:12px">Popularity blends members joined, completion rate and reward redemptions (0–100). Prototype only: brands are shown for illustration, not as actual TouchGrass partners, and all figures are invented.</p></section>'+
    '</main></div></div>';
}

/* ---------------- render ---------------- */
function switcher(){
  return '<nav class="switcher" aria-label="Prototype screens">'+[['start','Start'],['member','Member app'],['partner','Partner portal']].map(function(v){
    return '<button type="button" data-act="view" data-id="'+v[0]+'" aria-pressed="'+(S.view===v[0])+'">'+v[1]+'</button>';
  }).join('')+'</nav>';
}
function render(){
  var key = S.view + ':' + S.tab, sc = document.getElementById('scroll'), top = sc ? sc.scrollTop : 0;
  var focusId = document.activeElement && document.activeElement.closest ? document.activeElement.closest('[data-act]') : null;
  var focusSig = focusId ? focusId.getAttribute('data-act') + '|' + focusId.getAttribute('data-id') : null;
  var html = S.view === 'member' ? member() : S.view === 'partner' ? partner() : start();
  document.getElementById('app').innerHTML = switcher() + html;
  var sc2 = document.getElementById('scroll');
  if (sc2) sc2.scrollTop = (key === lastKey) ? top : 0;
  lastKey = key;
  if (focusSig) {
    var parts = focusSig.split('|');
    var sel = '[data-act="'+parts[0]+'"]' + (parts[1] && parts[1] !== 'null' ? '[data-id="'+parts[1]+'"]' : '');
    var el = document.querySelector(sel); if (el) el.focus({ preventScroll: true });
  }
  if (S.view === 'member' && S.tab === 'today') animateBar();
}
render();
})();
</script>
</body>
</html>
